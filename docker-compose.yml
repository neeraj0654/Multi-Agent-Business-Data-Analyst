version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: bda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: business_db
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d business_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ollama (Local LLM) ────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: bda_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Model Puller (pulls llama3 on first run) ──────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: bda_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "ollama pull llama3 && ollama pull nomic-embed-text"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # ─── Business Data Analyst App ─────────────────────────
  app:
    build: .
    container_name: bda_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=business_db
      - POSTGRES_USER=analyst
      - POSTGRES_PASSWORD=analyst_secret
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - LLM_PROVIDER=ollama
      - CHARTS_DIR=/app/charts
    volumes:
      - charts_data:/app/charts
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  charts_data:
